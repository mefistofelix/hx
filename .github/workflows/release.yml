name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" repo -- --depth=1
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            git fetch --depth=1 origin "$GITHUB_REF_NAME" || true
            git checkout "$GITHUB_REF_NAME" || true
          fi

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          bash ./test.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" repo -- --depth=1
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            git fetch --depth=1 origin "$GITHUB_REF_NAME" || true
            git checkout "$GITHUB_REF_NAME" || true
          fi

      - name: Build Linux
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          bash ./build.sh

      - name: Build Windows
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          TARGET_OS=windows TARGET_ARCH=amd64 TARGET_BIN_PATH="$PWD/bin/hx.exe" bash ./build.sh

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" bin/hx bin/hx.exe --clobber
